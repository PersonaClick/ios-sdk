# Lint of the SDK core: nothing reachable from the public API may crash the app on a force operation
# (documentation-unified sdk/core/resilience.md). UI, stories and the design system are not covered yet.
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - custom_rules

included:
  - PersonaClick/Classes/Core
  - PersonaClick/Classes/Sdk
  - PersonaClick/Classes/Notifications
  - PersonaClick/Classes/Tracking
  - PersonaClick/Classes/Cart
  - PersonaClick/Classes/Stories/API
  - PersonaClick/Classes/Predict
  - PersonaClick/Classes/Loyalty
  - PersonaClick/Classes/Sliders
  - PersonaClick/Classes/Reviews
  - PersonaClick/Classes/Search
  - PersonaClick/Classes/Products
  - PersonaClick/Classes/Collections
  - PersonaClick/Classes/Recommendations
  - PersonaClick/Classes/Profile
  - PersonaClick/Classes/Subscription
  - PersonaClick/Classes/Segments
  - PersonaClick/Classes/Infrastructure
  - PersonaClick/Classes/Domain
  - PersonaClick/Classes/Errors
  - PersonaClick/Classes/Regex
  - PersonaClick/Classes/Application
  - PersonaClick/Classes/Config
  - PersonaClick/Classes/AppSettings
  - PersonaClick/Classes/Shared
  - PersonaClick/Classes/Model
  - PersonaClick/Classes/Extensions/NetworkStatus
  - PersonaClick/Classes/Extensions/SessionQueue
  - PersonaClick/Classes/Extensions/InitService.swift
  - PersonaClick/Classes/Extensions/UserDefaultsExtension.swift

excluded:
  - PersonaClick/Classes/Model/Stories.swift

force_unwrapping: error
force_try: error
force_cast: error

custom_rules:
  # A synchronized copy of the SDK renames the module and the `PersonaClick` facade to the same word, so
  # `PersonaClick.X` there means the facade's nested type, not the module's: the copy stops compiling.
  module_qualified_name:
    name: "Module-qualified name"
    regex: '\bPersonaClick\.[A-Z]'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "A synchronized copy renames the module and PersonaClick to the same word: use a plain name or LegacySdkError / LegacyPushEvent"
    severity: error
