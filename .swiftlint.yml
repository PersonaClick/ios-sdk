# Lint of the whole SDK: nothing reachable from the public API may crash the app on a force operation
# (documentation-unified sdk/core/resilience.md). The legacy UI files that still force-unwrap say so with
# `swiftlint:disable force_unwrapping` at their top; force tries and casts are nowhere.
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - custom_rules

included:
  - PersonaClick/Classes

force_unwrapping: error
force_try: error
force_cast: error

custom_rules:
  # A synchronized copy of the SDK renames the module and the `PersonaClick` facade to the same word, so
  # `PersonaClick.X` there means the facade's nested type, not the module's: the copy stops compiling.
  module_qualified_name:
    name: "Module-qualified name"
    regex: '\bPersonaClick\.[A-Z]'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "A synchronized copy renames the module and PersonaClick to the same word: use a plain name or LegacySdkError / LegacyPushEvent"
    severity: error
